name: Packages
on:
  workflow_dispatch: {} # manual trigger
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
    - main
  pull_request: {} # any target

jobs:
  rpm-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: 'centos-9'
            image: 'quay.io/centos/centos:stream9'
          - name: 'centos-10'
            image: 'quay.io/centos/centos:stream10'
    name: Build RPM packages (${{matrix.os.name}})
    runs-on: ubuntu-latest
    container: ${{matrix.os.image}}
    permissions:
      contents: read
    steps:
      - name: Set up OS
        run: |
          dnf install -y 'dnf-command(config-manager)' epel-release
          dnf config-manager --set-enabled crb
          dnf install -y \
              git \
              rpm-build rpmlint \
              python3-pip python3-wheel python3-setuptools
          pip3 install tito
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          create-symlink: true
      - name: Dependencies
        run: dnf builddep -y bsl.spec
      - name: Build
        run: ./build.sh rpm-build
      - name: Check
        run: ./build.sh rpm-check || true
      - name: Summarize Results
        if: always()
        run: |
          echo "## rpmlint results:" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat build/default/pkg/rpmlint.txt >> $GITHUB_STEP_SUMMARY || true
          echo >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      - name: Archive packages
        uses: actions/upload-artifact@v6
        with:
          name: ${{github.job}}-${{matrix.os.name}}
          path: |
            build/default/pkg/*.rpm
            build/default/pkg/*/*.rpm
            build/default/pkg/rpmlint.txt
          retention-days: 1

  rpm-install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: 'centos-9'
            image: 'quay.io/centos/centos:stream9'
          - name: 'centos-10'
            image: 'quay.io/centos/centos:stream10'
    name: Install RPM packages (${{matrix.os.name}})
    needs: rpm-build
    runs-on: ubuntu-latest
    container: ${{matrix.os.image}}
    permissions:
      contents: read
    steps:
      - name: Set up OS
        run: |
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y \
              git \
              gcc pkgconf-pkg-config cmake ninja-build \
              autoconf autoconf-archive automake \
              python3-pip python3-wheel
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-build-${{matrix.os.name}}
      - name: Install
        run: dnf install -y x86_64/bsl*.rpm
      - name: Unit tests
        run: |
          cd /usr/libexec/bsl
          FAILURES=0
          for TESTEXEC in $(find . -maxdepth 1 -type f -a -executable)
          do
            $TESTEXEC || FAILURES=$(($FAILURES + 1))
          done
          exit $FAILURES
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # root files and test subtree
          sparse-checkout: |
            mock-bpa-test
            lib-user-test
      - name: Trial build
        run: DESTDIR="" ./build.sh check-install
      - name: Mock BPA tests
        run: |
          pip3 install -e mock-bpa-test/
          python3 -m pytest mock-bpa-test
