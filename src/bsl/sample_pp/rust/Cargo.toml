[package]
name = "bsl-sample-pp-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
build = "build.rs"

[lib]
name = "bsl_sample_pp_rust"
crate-type = ["staticlib"]

[dependencies]
cheadergen = "0.3.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
bindgen = "0.73.2"

